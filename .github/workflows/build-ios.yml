# .github/workflows/build-ios.yml
name: Build iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild archive \
            -workspace JustAgram.xcworkspace \
            -scheme JustAgram \
            -destination 'generic/platform=iOS' \
            -archivePath build/JustAgram.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO
          # Package into IPA
          mkdir -p build/ipa/Payload
          cp -r build/JustAgram.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r JustAgram.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JustAgram.ipa
          path: ios/build/ipa/JustAgram.ipa   
